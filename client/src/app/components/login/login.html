<div class="min-h-screen flex items-center justify-center">
  <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-96 border border-gray-700">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white mb-2">DevGraph</h2>
      <p class="text-gray-400">Sign in to your account</p>
    </div>

    <form class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
        <input 
          type="text" 
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          placeholder="Enter username"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
        <input 
          type="password" 
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          placeholder="Enter password"
        >
      </div>

      <button 
        type="submit" 
        class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md shadow-md transition-colors duration-200">
        Sign In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-400">
      Don't have an account? <a href="#" class="text-blue-500 hover:text-blue-400 font-medium">Register</a>
    </p>

  </div>
</div>
