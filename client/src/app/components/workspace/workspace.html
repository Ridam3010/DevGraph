<div class="h-screen bg-gray-900 text-white flex flex-col">
  
  <!-- Navbar specifically for the Workspace -->
  <header class="h-14 bg-gray-800 border-b border-gray-700 flex items-center px-6 justify-between">
    <div class="flex items-center space-x-4">
      <a routerLink="/dashboard" class="text-gray-400 hover:text-white transition flex items-center">
        ← Back to Dashboard
      </a>
    </div>
    <div class="flex space-x-4">
      <button class="px-6 py-1.5 bg-green-600 hover:bg-green-500 rounded-md font-semibold transition shadow-lg">
        Submit Code
      </button>
    </div>
  </header>

  <!-- The Split Screen Layout -->
  <main class="flex-1 flex overflow-hidden">
    
        <!-- LEFT SIDE: Problem Description -->
    <section class="w-1/2 p-6 overflow-y-auto border-r border-gray-700 bg-gray-800">
      
      <!-- Only show this if the problem data has successfully loaded -->
      @if (problem) {
        <div class="mb-6">
          <h1 class="text-3xl font-bold mb-2">{{ problem.title }}</h1>
          <span class="px-3 py-1 text-sm font-semibold rounded-full" 
                [ngClass]="{
                  'bg-green-900 text-green-300': problem.difficulty === 'Easy',
                  'bg-yellow-900 text-yellow-300': problem.difficulty === 'Medium',
                  'bg-red-900 text-red-300': problem.difficulty === 'Hard'
                }">
            {{ problem.difficulty }}
          </span>
        </div>
        
        <div class="prose prose-invert max-w-none">
          <!-- We use innerHTML because problem descriptions often contain HTML bold/code tags -->
          <p class="text-gray-300 leading-relaxed" [innerHTML]="problem.description"></p>
        </div>
      } @else {
        <div class="flex items-center justify-center h-full">
           <p class="text-gray-400 animate-pulse">Loading problem details...</p>
        </div>
      }

    </section>


    <!-- RIGHT SIDE: Code Editor (Coming Soon!) -->
    <section class="w-1/2 flex flex-col bg-[#1e1e1e]">
      <!-- Fake Editor Tabs -->
      <div class="flex bg-gray-800 text-sm">
        <div class="px-4 py-2 bg-[#1e1e1e] border-t-2 border-blue-500 text-blue-400">Solution.java</div>
      </div>
      
      <!-- Where the actual code editor will go -->
      <div class="flex-1 p-4 flex items-center justify-center border-b border-gray-700">
        <p class="text-gray-500 italic">The Monaco Code Editor will load here soon...</p>
      </div>
      
      <!-- Fake Terminal Output -->
      <div class="h-48 p-4 bg-gray-900 font-mono text-sm">
        <span class="text-gray-500">Terminal Output</span>
        <p class="text-gray-400 mt-2">> Ready to execute code.</p>
      </div>
    </section>

  </main>
</div>
