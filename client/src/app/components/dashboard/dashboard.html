<div class="min-h-screen bg-gray-900 flex text-white">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
    <div class="p-6">
      <h2 class="text-2xl font-bold text-blue-500">DevGraph</h2>
    </div>
    <nav class="flex-1 px-4 space-y-2">
      <a href="#" class="block px-4 py-2 bg-blue-600 rounded-md shadow-sm transition">Problems</a>
    </nav>
    <div class="p-4 border-t border-gray-700">
      <button class="w-full px-4 py-2 text-left text-red-400 hover:bg-gray-700 rounded-md transition">Sign Out</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold">Coding Problems</h1>
      <div class="h-10 w-10 bg-blue-500 rounded-full flex items-center justify-center font-bold">U</div>
    </header>

    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden shadow-xl">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-700 border-b border-gray-600">
            <th class="p-4 font-semibold text-gray-300">Title</th>
            <th class="p-4 font-semibold text-gray-300">Difficulty</th>
            <th class="p-4 font-semibold text-gray-300">Action</th>
          </tr>
        </thead>
                <tbody>
          <!-- 1. Check if we are still loading -->
          @if (isLoading) {
            <tr>
              <td colspan="3" class="p-8 text-center">
                <!-- A pure CSS spinning circle using Tailwind! -->
                <div class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-2 text-gray-400">Loading problems...</p>
              </td>
            </tr>
          } @else {
            <!-- 2. Only show the problems if we are NOT loading -->
            @for (problem of problems; track problem.id) {
              <tr class="border-b border-gray-700 hover:bg-gray-750 transition">
                <td class="p-4 font-medium">{{ problem.title }}</td>
                <td class="p-4" [ngClass]="{
                  'text-green-400': problem.difficulty === 'Easy',
                  'text-yellow-400': problem.difficulty === 'Medium',
                  'text-red-400': problem.difficulty === 'Hard'
                }">{{ problem.difficulty }}</td>
                <td class="p-4"><button class="px-4 py-1 bg-gray-600 hover:bg-gray-500 rounded-md transition">Solve</button></td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="p-4 text-center text-gray-500 italic">No problems found.</td>
              </tr>
            }
          }
        </tbody>
      </table>
    </div>
  </main>
</div>
